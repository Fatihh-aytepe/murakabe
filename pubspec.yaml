name: murakabe
description: Günlük İslami İbadet Hatırlatıcı
publish_to: 'none'
version: 1.1.9+3

environment:
  # pubspec.lock bu projeyi Dart >=3.10.3 / Flutter >=3.38.4 ile kilitliyor;
  # alt sınır burada da eşitlendi ki eski bir Flutter SDK ile `flutter pub get`
  # görünürde başarılı olup derleme sırasında şaşırtıcı hatalar üretmesin.
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # Firebase
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  firebase_remote_config: ^6.5.0
  # App Check: her isteğin gerçek uygulamamızdan (ve gerçek bir cihazdan)
  # geldiğini doğrular — bkz. main.dart'taki activate() çağrısı. Zorlama
  # (enforce) Firebase Console'dan AYRI olarak açılır, bkz. o çağrının
  # yanındaki yorum.
  firebase_app_check: ^0.4.7

  # Update
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  syncfusion_flutter_pdfviewer: 33.2.5
  # Güncelleme APK'sının bütünlüğünü doğrulamak için (SHA-256) — zaten
  # firebase paketleri üzerinden geçişli bağımlılık olarak çözülüyordu,
  # burada doğrudan bağımlılık olarak listelendi (bkz. UpdateService).
  crypto: ^3.0.3

  # Local DB
  sqflite: ^2.3.0
  path: ^1.8.3

  # Storage
  shared_preferences: ^2.2.2

  # Notifications & Alarm
  flutter_local_notifications: ^17.2.4

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  animate_do: ^3.1.2

  # State Management
  provider: ^6.1.1

  # Utils
  intl: ^0.20.0
  uuid: ^4.2.2
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  timezone: ^0.9.2
  image_picker: ^1.1.2

  # Zengin metin editörü (Notlar ekranı)
  flutter_quill: ^11.4.0

  # Not ızgara (grid/masonry) görünümü
  flutter_staggered_grid_view: ^0.7.0

  # Notlar: resim/ses eki için kalıcı dosya yolu, ses kaydı
  path_provider: ^2.1.6
  record: ^6.2.1

  # Namaz Vakitleri & Konum
  geolocator: ^12.0.0
  adhan: ^2.0.0+1
  audioplayers: ^5.2.1
  http: ^1.2.0

# Pusula (Kıble Bulucu için)
  flutter_compass: ^0.8.1
  # Kıble Bulucu'da kullanıcının konumunu "Şehir, Ülke" biçiminde göstermek
  # için (reverse geocoding). Konum izni zaten alınıyor, ek izin gerekmez.
  geocoding: ^5.0.0
  firebase_storage: ^13.4.5

  # Arka planda namaz vakti/zikir/günlük içerik widget verisini tazelemek
  # için (WorkManager sarmalayıcısı) — Android'in pil tasarrufu/Doze
  # kurallarına tabidir, gerçek periyodik iş sistemin kendisi tarafından
  # (JobScheduler/WorkManager) zamanlanır, biz sadece iş tanımlıyoruz.
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/yenilogo.png"

flutter:
 

  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/ayetler.json
    - assets/data/hadisler.json
    - assets/data/esmaul_husna.json
    - assets/data/zikirler.json
    - assets/sounds/
    # TELİF: İzin alınana kadar APK'ya dahil edilmiyor (dosyalar diskte duruyor).
    # - assets/tefsir/tefhimul_kuran.pdf
    # - assets/riyazusalihin/riyazusalihin.pdf
    
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    # Kur'an metni — KFGQPC HAFS Uthmanic Script (Medine Mushafı hattı).
    # Quran.com API'deki text_qpc_hafs alanı bu font için kodlanmıştır;
    # ayet sonundaki rakamı süslü ayet sonu işareti olarak çizer.
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf